---
##############################################
# Prometheus Server Installation
##############################################
# Installs Prometheus server to collect metrics
# from all Node Exporters across the infrastructure
##############################################

- name: Create prometheus user
  user:
    name: prometheus
    system: yes
    shell: /bin/false
    create_home: no

- name: Create prometheus directories
  file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: Check if Prometheus is already installed
  stat:
    path: /usr/local/bin/prometheus
  register: prometheus_binary

- name: Download Prometheus
  get_url:
    url: "{{ prometheus_download_url }}"
    dest: "/tmp/prometheus.tar.gz"
    mode: '0644'
  when: not prometheus_binary.stat.exists

- name: Extract Prometheus
  unarchive:
    src: "/tmp/prometheus.tar.gz"
    dest: "/tmp"
    remote_src: yes
  when: not prometheus_binary.stat.exists

- name: Copy Prometheus binaries
  copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: prometheus
    group: prometheus
    mode: '0755'
    remote_src: yes
  loop:
    - prometheus
    - promtool
  when: not prometheus_binary.stat.exists

- name: Copy Prometheus console files
  copy:
    src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/etc/prometheus/{{ item }}"
    owner: prometheus
    group: prometheus
    mode: '0644'
    remote_src: yes
  loop:
    - consoles
    - console_libraries
  when: not prometheus_binary.stat.exists

- name: Create Prometheus rules directory
  ansible.builtin.file:
    path: /etc/prometheus/rules
    state: directory
    owner: prometheus
    group: prometheus
    mode: '0755'


- name: Deploy Prometheus monitoring and alert rules
  ansible.builtin.copy:
    src: "rules/{{ item }}"
    dest: "/etc/prometheus/rules/{{ item }}"
    owner: prometheus
    group: prometheus
    mode: '0644'
  loop:
    - monitoring-rules.yml
    - alert-rules.yml
  notify: Restart Prometheus
  
- name: Clean up downloaded files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/prometheus.tar.gz"
    - "/tmp/prometheus-{{ prometheus_version }}.linux-amd64"

- name: Create Prometheus configuration file
  template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: '0644'
  notify: restart prometheus

- name: Create systemd service file
  template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    mode: '0644'
  notify: restart prometheus

- name: Enable and start Prometheus service
  systemd:
    name: prometheus
    state: started
    enabled: yes
    daemon_reload: yes

- name: Wait for Prometheus to be ready
  uri:
    url: "http://localhost:{{ prometheus_port }}/-/healthy"
    status_code: 200
  register: prometheus_health
  retries: 10
  delay: 3
  ignore_errors: yes

- name: Display Prometheus access information
  debug:
    msg:
      - "Prometheus is installed and running"
      - "Access URL: http://{{ ansible_default_ipv4.address | default('localhost') }}:{{ prometheus_port }}"
      - "Metrics URL: http://{{ ansible_default_ipv4.address | default('localhost') }}:{{ prometheus_port }}/metrics"
      - "Targets URL: http://{{ ansible_default_ipv4.address | default('localhost') }}:{{ prometheus_port }}/targets"
