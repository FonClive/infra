plugin: aws_ec2

aws_profile: default

regions:
  - us-east-1   # replace with your region

# Use instance-id as hostname for SSM connectivity
hostnames:
  - instance-id
  
# Compose variables for each host
compose:
  # Use instance ID for SSM connection
  ansible_host: instance_id
  # Keep public IP for reference (useful for verification)
  public_ip: public_ip_address
  # SSM connection configuration
  ansible_connection: aws_ssm
  ansible_aws_ssm_region: us-east-1
  
filters:
  # Find all instances with specific roles
  tag:Role:
    - frontend
    - sonarqube
    - monitor
  instance-state-name: running  # only running instances

keyed_groups:
  # Group by Role tag (role_frontend, role_sonarqube, role_monitor)
  - key: tags.Role
    prefix: "role"
  # Group by Environment tag (env_dev, env_prod)
  - key: tags.Environment
    prefix: "env"
  # Group by instance type (t2_nano, t2_micro, etc)
  - key: instance_type
    prefix: "instance_type"
