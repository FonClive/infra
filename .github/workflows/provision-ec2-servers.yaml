name: Provision EC2 Servers with Ansible

on:
  workflow_dispatch:
    inputs:
      target_group:
        description: 'Target host group (all, role_frontend, role_sonarqube, role_monitor)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - role_frontend
          - role_sonarqube
          - role_monitor
      tags:
        description: 'Ansible tags to run (comma-separated: base,ssh,web,sonarqube,monitoring,puppet)'
        required: false
        default: 'all'
        type: string
      dry_run:
        description: 'Run in check mode (dry run)'
        required: false
        default: false
        type: boolean
  
  push:
    branches:
      - main
    paths:
      - 'infra/ansible/roles/**'
      - 'infra/ansible/provision-servers.yml'
      - '.github/workflows/provision-ec2-servers.yaml'

env:
  AWS_REGION: us-east-1
  ANSIBLE_HOST_KEY_CHECKING: False

jobs:
  validate:
    name: Validate Ansible Configuration
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Ansible and dependencies
        run: |
          pip install ansible ansible-lint boto3 botocore
      
      - name: Validate Ansible syntax
        working-directory: infra/ansible
        run: |
          ansible-playbook provision-servers.yml --syntax-check
      
      - name: Lint Ansible playbook
        working-directory: infra/ansible
        run: |
          ansible-lint provision-servers.yml || true
      
      - name: Validate inventory
        working-directory: infra/ansible
        run: |
          ansible-inventory -i inventory/aws_ec2.yml --list

  provision:
    name: Provision Servers
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Ansible and SSM plugin
        run: |
          pip install ansible boto3 botocore
          # Install the SSM plugin for AWS CLI
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb
      
      - name: Discover EC2 instances
        id: ec2-discovery
        run: |
          echo "Discovering EC2 instances..."
          INSTANCE_COUNT=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=frontend,sonarqube,monitor" "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].InstanceId' \
            --output text | wc -w)
          
          echo "instance_count=$INSTANCE_COUNT" >> $GITHUB_OUTPUT
          echo "Found $INSTANCE_COUNT running instances"
          
          # Get instance details
          aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=frontend,sonarqube,monitor" "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].[InstanceId,Tags[?Key==`Role`].Value|[0],PrivateIpAddress,PublicIpAddress]' \
            --output table
      
      - name: Wait for SSM agents to be ready
        run: |
          echo "Waiting for SSM agents to be online..."
          
          INSTANCE_IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=frontend,sonarqube,monitor" "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].InstanceId' \
            --output text)
          
          if [ -z "$INSTANCE_IDS" ]; then
            echo "⚠️  No instances found. Skipping provisioning."
            exit 0
          fi
          
          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "Checking SSM status for $INSTANCE_ID..."
            TIMEOUT=300
            ELAPSED=0
            
            while [ $ELAPSED -lt $TIMEOUT ]; do
              STATUS=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text 2>/dev/null || echo "NotFound")
              
              if [ "$STATUS" = "Online" ]; then
                echo "✓ $INSTANCE_ID is online"
                break
              fi
              
              echo "⏳ Waiting for $INSTANCE_ID to come online (${ELAPSED}s elapsed)... Current status: $STATUS"
              sleep 10
              ELAPSED=$((ELAPSED + 10))
            done
            
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "✗ Timeout waiting for $INSTANCE_ID"
              exit 1
            fi
          done
          
          echo "✓ All instances are ready for provisioning"
      
      - name: Test Ansible inventory
        working-directory: infra/ansible
        run: |
          echo "Testing Ansible inventory..."
          ansible-inventory -i inventory/aws_ec2.yml --graph
      
      - name: Test Ansible connectivity
        working-directory: infra/ansible
        run: |
          echo "Testing Ansible connectivity via SSM..."
          ansible all -i inventory/aws_ec2.yml -m ping -v || true
      
      - name: Run Ansible provisioning
        working-directory: infra/ansible
        run: |
          echo "Starting Ansible provisioning..."
          
          ANSIBLE_CMD="ansible-playbook -i inventory/aws_ec2.yml provision-servers.yml"
          
          # Add limit if specified
          if [ "${{ github.event.inputs.target_group }}" != "all" ] && [ -n "${{ github.event.inputs.target_group }}" ]; then
            ANSIBLE_CMD="$ANSIBLE_CMD --limit ${{ github.event.inputs.target_group }}"
          fi
          
          # Add tags if specified
          if [ "${{ github.event.inputs.tags }}" != "all" ] && [ -n "${{ github.event.inputs.tags }}" ]; then
            ANSIBLE_CMD="$ANSIBLE_CMD --tags ${{ github.event.inputs.tags }}"
          fi
          
          # Add check mode if dry run
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ANSIBLE_CMD="$ANSIBLE_CMD --check"
            echo "🔍 Running in DRY RUN mode (--check)"
          fi
          
          # Add verbosity
          ANSIBLE_CMD="$ANSIBLE_CMD -v"
          
          echo "Executing: $ANSIBLE_CMD"
          eval $ANSIBLE_CMD
      
      - name: Verify services
        if: github.event.inputs.dry_run != 'true'
        working-directory: infra/ansible
        run: |
          echo "Verifying deployed services..."
          
          # Run health checks
          ansible all -i inventory/aws_ec2.yml \
            -m shell \
            -a "systemctl is-active nginx || echo 'nginx not installed'" \
            --become || true
          
          ansible all -i inventory/aws_ec2.yml \
            -m shell \
            -a "systemctl is-active sonarqube || echo 'sonarqube not installed'" \
            --become || true
      
      - name: Get service URLs
        if: github.event.inputs.dry_run != 'true'
        id: service-urls
        run: |
          echo "### 🚀 Provisioning Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Frontend servers
          FRONTEND_IPS=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=frontend" "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].PublicIpAddress' \
            --output text)
          
          if [ -n "$FRONTEND_IPS" ]; then
            echo "**Frontend Servers (Nginx + Portfolio):**" >> $GITHUB_STEP_SUMMARY
            for IP in $FRONTEND_IPS; do
              echo "- 🌐 http://$IP" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # SonarQube servers
          SONARQUBE_IPS=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=sonarqube" "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].PublicIpAddress' \
            --output text)
          
          if [ -n "$SONARQUBE_IPS" ]; then
            echo "**SonarQube Servers:**" >> $GITHUB_STEP_SUMMARY
            for IP in $SONARQUBE_IPS; do
              echo "- 🔍 http://$IP:9000 (admin/admin)" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Monitoring servers
          MONITOR_IPS=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=monitor" "Name=instance-state-name,Values=running" \
            --query 'Reservations[*].Instances[*].PublicIpAddress' \
            --output text)
          
          if [ -n "$MONITOR_IPS" ]; then
            echo "**Monitoring Servers (Prometheus):**" >> $GITHUB_STEP_SUMMARY
            for IP in $MONITOR_IPS; do
              echo "- 📊 http://$IP:9090" >> $GITHUB_STEP_SUMMARY
            done
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "**Provisioning Details:**" >> $GITHUB_STEP_SUMMARY
          echo "- Target Group: ${{ github.event.inputs.target_group || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ${{ github.event.inputs.tags || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload Ansible logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ansible-logs
          path: |
            infra/ansible/*.log
          retention-days: 7

  notify:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: provision
    if: always()
    
    steps:
      - name: Provisioning Status
        run: |
          if [ "${{ needs.provision.result }}" == "success" ]; then
            echo "✅ Server provisioning completed successfully"
          else
            echo "❌ Server provisioning failed"
            exit 1
          fi
