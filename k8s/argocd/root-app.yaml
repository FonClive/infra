apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: root-application
  namespace: argocd
spec: 
  project: default
  source:
    repoURL: https://github.com
    targetRevision: Head
    path: argocd-root/templates
  destination:
    server: https://default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selHeal: true