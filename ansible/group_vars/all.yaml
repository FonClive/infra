# Global Ansible Configuration for All Hosts
# Using SSM Session Manager instead of SSH

# SSM connection settings
ansible_connection: community.aws.aws_ssm
ansible_aws_ssm_region: us-east-1

# Python interpreter
ansible_python_interpreter: /usr/bin/python3

# Become settings
ansible_become: true
ansible_become_method: sudo

# Disable SSH host key checking (not used with SSM but good practice)
ansible_host_key_checking: false
# Admin users (from users.yaml)
admins:
  - name: Clive
    key: "private key"
