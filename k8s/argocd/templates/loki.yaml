apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
spec:
  project: default
  source:
    chart: loki
    repoURL: https://github.io
    targetRevision: 6.6.x
    helm:
      values: |
        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
  destination:
    server: https://default.svc
    namespace: telemetry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
