apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 1.7.1
    helm:
      releaseName: aws-load-balancer-controller
      values: |
        clusterName: pamfes-dev-cluster
        region: us-east-1
        vpcId: vpc-YOUR_VPC_ID  # Replace with your VPC ID
        
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::476415713645:role/AmazonEKSLoadBalancerControllerRole
        
        # Enable Shield, WAF, and other features
        enableShield: false
        enableWaf: false
        enableWafv2: false
        
        # Resource limits
        resources:
          limits:
            cpu: 200m
            memory: 500Mi
          requests:
            cpu: 100m
            memory: 200Mi
        
        # Replica count
        replicaCount: 2
        
        # Enable cert-manager for webhook certificates
        enableCertManager: false
        
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
