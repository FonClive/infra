# Ansible Configuration for Infrastructure Automation
# 
# This file provides sensible defaults for all playbooks in this directory.
# 
# Override settings using environment variables:
#   ANSIBLE_FORKS=20 ansible-playbook playbook.yml
#   ANSIBLE_TIMEOUT=60 ansible-playbook playbook.yml
#
# Or use a custom config file:
#   ANSIBLE_CONFIG=ansible.custom.cfg ansible-playbook playbook.yml
#
# See: https://docs.ansible.com/ansible/latest/reference_appendices/config.html

[defaults]
# Inventory configuration
inventory = inventory/aws_ec2.yml
host_key_checking = False

# Output configuration
stdout_callback = yaml
callbacks_enabled = timer, profile_tasks

# Deprecation warnings
deprecation_warnings = False

# Connection settings
timeout = 30
forks = 10

# Privilege escalation
become = True
become_method = sudo

[inventory]
# Enable inventory plugins
enable_plugins = amazon.aws.aws_ec2, ini, yaml

# Cache settings for dynamic inventory
cache = yes
cache_plugin = jsonfile
cache_timeout = 3600
cache_connection = .ansible_cache

[persistent_connection]
# Connection timeouts for SSM
command_timeout = 30
connect_timeout = 30
