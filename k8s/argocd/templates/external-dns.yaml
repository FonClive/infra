apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: external-dns
  namespace: argocd
spec: 
  project: default
  source: 
    repoURL: https://github.io
    chart: kube-prometheuse-stack
    targetRevision: Head
    helm:
      valueFiles:
        - $values/apps/kube-prometheuse/values.yaml
  destination:
    server: https://default.svc
    namespace: app
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true 