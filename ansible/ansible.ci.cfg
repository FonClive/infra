# CI/CD-specific Ansible Configuration
# Use with: ANSIBLE_CONFIG=ansible.ci.cfg ansible-playbook playbook.yml

[defaults]
inventory = inventory/aws_ec2.yml
host_key_checking = False
stdout_callback = yaml
callbacks_enabled = timer, profile_tasks
deprecation_warnings = False
timeout = 60              # Longer timeout for CI/CD
forks = 20                # More parallelism in CI/CD
become = True
become_method = sudo

[inventory]
enable_plugins = amazon.aws.aws_ec2, ini, yaml
cache = no                # Disable cache in CI/CD for fresh data

[persistent_connection]
command_timeout = 60      # Longer timeout for CI/CD
connect_timeout = 60
