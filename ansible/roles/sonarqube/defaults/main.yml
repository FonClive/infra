---
# SonarQube Configuration
sonarqube_version: "10.3.0.82913"
sonarqube_download_url: "https://binaries.sonarsource.com/Distribution/sonarqube/sonarqube-{{ sonarqube_version }}.zip"
sonarqube_install_dir: "/opt/sonarqube"
sonarqube_data_dir: "/var/sonarqube/data"
sonarqube_logs_dir: "/var/sonarqube/logs"
sonarqube_temp_dir: "/var/sonarqube/temp"

# SonarQube system user
sonarqube_user: sonarqube
sonarqube_group: sonarqube

# SonarQube web configuration
sonarqube_web_host: "0.0.0.0"
sonarqube_web_port: 9000
sonarqube_web_context: ""

# Database configuration (PostgreSQL recommended)
sonarqube_db_embedded: true  # Set to false to use external PostgreSQL
sonarqube_db_type: "postgresql"
sonarqube_db_host: "localhost"
sonarqube_db_port: 5432
sonarqube_db_name: "sonarqube"
sonarqube_db_user: "sonarqube"
sonarqube_db_password: "sonarqube"

# Java configuration
sonarqube_java_opts: "-Xmx512m -Xms128m"

# System limits
sonarqube_max_map_count: 524288
sonarqube_max_file_descriptors: 131072
