apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: 
  name: kube-promethuese-stack
  namespace: argocd
spec: 
  project: default
  source: 
    repoURL: https://github.io
    chart: kube-prometheuse-stack
    targetRevision: 68.3.2
    helm:
      valueFiles:
        - /infra/k8s/argocd/apps/kube-prometheuse/values.yaml
  destination:
    server:  https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m