apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portfolio-app
  namespace: argocd
  labels:
    app: portfolio
spec:
  project: default
  source:
    repoURL: https://github.com/your-username/e-2-e-infrastructure  # Replace
    targetRevision: HEAD
    path: infra/k8s/portfolio
  destination:
    server: https://kubernetes.default.svc
    namespace: portfolio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  # Optional: Image updater annotations for auto-update on new tags
  annotations:
    argocd-image-updater.argoproj.io/image-list: portfolio=476415713645.dkr.ecr.us-east-1.amazonaws.com/portfolio-landing-page
    argocd-image-updater.argoproj.io/portfolio.update-strategy: latest
    argocd-image-updater.argoproj.io/portfolio.pull-secret: pullsecret:argocd/ecr-creds
